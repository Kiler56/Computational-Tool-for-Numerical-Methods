# ═══════════════════════════════════════════════════════════
# Nginx — Reverse Proxy for Numerical Methods Calculator
# ═══════════════════════════════════════════════════════════
# Optimized for production: rate-limiting, gzip, security headers

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ── Gzip Compression ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Rate Limiting ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # ── Upstream: Flask App ───────────────────────────────
    upstream flask_app {
        server app:5000;
    }

    # ── HTTP Server ───────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security Headers ──────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Static Files (cached by Nginx) ────────────────
        location /static/ {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;

            # Cache static assets for 7 days
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── API endpoints (stricter rate limit) ───────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for computation-heavy methods
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        # ── All other routes ──────────────────────────────
        location / {
            limit_req zone=general burst=40 nodelay;

            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── Health check passthrough ──────────────────────
        location = /health {
            proxy_pass http://flask_app/api/health;
            access_log off;
        }

        # ── Block dotfiles ────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
