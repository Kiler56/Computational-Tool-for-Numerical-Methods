{% extends "base.html" %}
{% block title %}Sign up — NumCalc{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">📝</span>
            <h1 data-i18n="register_title">Sign up</h1>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="auth-form" id="register-form">
            <div class="form-group">
                <label for="username" data-i18n="username_label">Username</label>
                <input type="text" id="username" name="username" value="{{ username|default('') }}" required autocomplete="username" placeholder="your_username">
            </div>

            <div class="form-group">
                <label for="email" data-i18n="email_label">Email</label>
                <input type="email" id="email" name="email" value="{{ email|default('') }}" required autocomplete="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password" data-i18n="password_label">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="At least 4 characters">
            </div>

            <div class="form-group">
                <label for="confirm_password" data-i18n="confirm_password_label">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="Repeat password">
            </div>

            <button type="submit" class="btn btn-primary btn-block" data-i18n="btn_register">Sign up</button>
        </form>

        <p class="auth-footer-link">
            <span data-i18n="has_account">Already have an account?</span>
            <a href="/login" data-i18n="login">Log in</a>
        </p>
    </div>
</section>
{% endblock %}
